// `./gradlew runClient`: one RuneLite client with every plugin in plugins/ loaded, for using
// this repo's plugins day to day (especially ones that can't go on the Plugin Hub).
// It runs RuneLite's official release jars in developer mode, with your normal ~/.runelite
// settings and Plugin Hub plugins. Log in from the "Jagex Accounts" sidebar panel.
//
// The launcher class is generated from each plugin's runelite-plugin.properties `plugins=` line,
// so new plugins are picked up automatically (no reflection, no class-name lookups at runtime).

def pluginProjects = rootProject.subprojects.findAll { it.projectDir.parentFile.name == 'plugins' }
pluginProjects.each { evaluationDependsOn(it.path) }

def pluginClasses = pluginProjects.collectMany { p ->
	def props = new Properties()
	p.file('runelite-plugin.properties').withInputStream { props.load(it) }
	(props.getProperty('plugins') ?: '').split(',').collect { it.trim() }.findAll { it }
}.sort()

def generatedDir = layout.buildDirectory.dir('generated/sources/launcher')

def generateLauncher = tasks.register('generateLauncher') {
	inputs.property('plugins', pluginClasses)
	outputs.dir(generatedDir)
	doLast {
		def file = generatedDir.get().file('devclient/DevClient.java').asFile
		file.parentFile.mkdirs()
		def classes = pluginClasses.collect { it + '.class' }.join(',\n\t\t\t')
		file.text = """package devclient;

import net.runelite.client.RuneLite;
import net.runelite.client.externalplugins.ExternalPluginManager;

/**
 * Generated by dev-client/build.gradle: loads every workspace plugin, then starts RuneLite.
 */
public class DevClient
{
	@SuppressWarnings("unchecked")
	public static void main(String[] args) throws Exception
	{
		ExternalPluginManager.loadBuiltin(
			${classes});
		RuneLite.main(args);
	}
}
"""
	}
}

sourceSets.main.java.srcDir(generatedDir)
tasks.named('compileJava') { dependsOn generateLauncher }

dependencies {
	pluginProjects.each { implementation project(it.path) }
	implementation group: 'net.runelite', name: 'client', version: 'latest.release'
	runtimeOnly group: 'net.runelite', name: 'jshell', version: 'latest.release'
}

tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Launches RuneLite with every plugin in plugins/ loaded.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'devclient.DevClient'
	// RuneLite requires assertions in developer mode; developer mode enables the Jagex Accounts login panel.
	jvmArgs '-ea'
	args '--developer-mode'
}
